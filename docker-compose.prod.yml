# Production stack for a single VPS:
#   docker compose -f docker-compose.prod.yml --env-file .env.production up -d --build
# Only Caddy is published; Postgres and the API are reachable inside the compose network only.

services:
  postgres:
    image: postgres:17
    restart: unless-stopped
    environment:
      POSTGRES_USER: nelcota
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD}
      POSTGRES_DB: nelcota_control
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U nelcota -d nelcota_control"]
      interval: 5s
      timeout: 3s
      retries: 20

  api:
    build:
      context: .
      dockerfile: crates/server/Dockerfile
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      CONTROL_PLANE_DATABASE_URL: postgres://nelcota:${POSTGRES_PASSWORD}@postgres:5432/nelcota_control
      TENANT_DATABASE_BASE_URL: postgres://nelcota:${POSTGRES_PASSWORD}@postgres:5432
      PUBLIC_BASE_URL: https://${API_DOMAIN:?set API_DOMAIN}
      MASTER_KEY_HEX: ${MASTER_KEY_HEX:?set MASTER_KEY_HEX}
      ADMIN_TOKEN: ${ADMIN_TOKEN:?set ADMIN_TOKEN}
      SMTP_URL: ${SMTP_URL:?set SMTP_URL}
      EMAIL_FROM: ${EMAIL_FROM:?set EMAIL_FROM}
      # Caddy is the only way in, so the address it appends to X-Forwarded-For is trusted.
      CLIENT_IP_HEADER: ${CLIENT_IP_HEADER:-x-forwarded-for}
      RUST_LOG: ${RUST_LOG:-info}

  caddy:
    build:
      context: .
      dockerfile: deploy/caddy/Dockerfile
      args:
        VITE_API_URL: https://${API_DOMAIN}
    restart: unless-stopped
    depends_on:
      - api
    environment:
      API_DOMAIN: ${API_DOMAIN}
      CONSOLE_DOMAIN: ${CONSOLE_DOMAIN:?set CONSOLE_DOMAIN}
      ACME_EMAIL: ${ACME_EMAIL:?set ACME_EMAIL}
    ports:
      - "${HTTP_PORT:-80}:80"
      - "${HTTPS_PORT:-443}:443"
      - "${HTTPS_PORT:-443}:443/udp"
    volumes:
      - caddy-data:/data
      - caddy-config:/config

volumes:
  postgres-data:
  caddy-data:
  caddy-config:
