[workspace]
resolver = "3"
members = ["crates/server"]

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
unwrap_used = "deny"
expect_used = "deny"
panic = "deny"
todo = "deny"
unimplemented = "deny"
indexing_slicing = "deny"
as_conversions = "deny"
dbg_macro = "deny"
print_stdout = "deny"
print_stderr = "deny"
let_underscore_must_use = "deny"
# The project style mandates explicit `== false` instead of the `!` operator (see CLAUDE.md).
bool_comparison = "allow"
