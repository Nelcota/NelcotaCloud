version: 2
updates:
  - package-ecosystem: cargo
    directory: /
    schedule:
      interval: weekly
    groups:
      rust:
        patterns: ["*"]
  - package-ecosystem: npm
    directory: /apps/console
    schedule:
      interval: weekly
    groups:
      console:
        patterns: ["*"]
  - package-ecosystem: npm
    directory: /packages/sdk
    schedule:
      interval: weekly
    groups:
      sdk:
        patterns: ["*"]
    ignore:
      # openapi-typescript needs the compiler API, which TypeScript 7.0 no longer ships.
      - dependency-name: typescript
        update-types: ["version-update:semver-major"]
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    # One PR for every action: they all edit ci.yml and would conflict with each other.
    groups:
      actions:
        patterns: ["*"]
  - package-ecosystem: docker
    directories:
      - /crates/server
      - /deploy/caddy
      - /deploy/backup
    schedule:
      interval: weekly
