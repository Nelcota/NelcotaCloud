name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  api:
    name: API (fmt, clippy, tests)
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:19
        env:
          POSTGRES_USER: nelcota
          POSTGRES_PASSWORD: nelcota
          POSTGRES_DB: nelcota_control
        ports:
          - 5434:5432
        options: >-
          --health-cmd "pg_isready -U nelcota -d nelcota_control"
          --health-interval 2s --health-timeout 3s --health-retries 20
      mailpit:
        image: axllent/mailpit:v1.34.0
        env:
          MP_SMTP_AUTH_ACCEPT_ANY: "1"
          MP_SMTP_AUTH_ALLOW_INSECURE: "1"
        ports:
          - 1026:1025
          - 8026:8025
    env:
      CONTROL_PLANE_DATABASE_URL: postgres://nelcota:nelcota@localhost:5434/nelcota_control
      TENANT_DATABASE_BASE_URL: postgres://nelcota:nelcota@localhost:5434
      SMTP_URL: smtp://localhost:1026
      EMAIL_FROM: NelcotaCloud <no-reply@nelcota.local>
      MAILPIT_API_URL: http://localhost:8026
      CACHE_VALKEY_URL: redis://:nelcota-ci@127.0.0.1:6380
      CARGO_TERM_COLOR: always
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@df2a88e9fe4098bad09cb42c3dec7187f15861fc # master
        with:
          toolchain: 1.100.0
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2
      - run: cargo fmt --all --check
      - run: cargo clippy --workspace --all-targets --all-features --locked -- -D warnings
      - name: Start authenticated Valkey
        run: |
          docker run --detach --rm --name nelcota-test-valkey --publish 127.0.0.1:6380:6379 \
            valkey/valkey:9.1.4 valkey-server --requirepass nelcota-ci
          timeout 30s bash -c '
            until docker exec --env VALKEYCLI_AUTH=nelcota-ci nelcota-test-valkey valkey-cli ping | grep -qx PONG; do
              sleep 1
            done
          '
      # Includes the check that crates/server/openapi.json matches the annotated routes.
      - run: cargo test --workspace --locked

  console:
    name: Console (format, lint, types, build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/console
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: 26
          cache: npm
          cache-dependency-path: apps/console/package-lock.json
      - run: npm ci
      - run: npm run format:check
      - run: npm run lint
      - name: Generated API types match openapi.json
        run: |
          npm run api:types
          git diff --exit-code -- src/shared/api/api-schema.d.ts
      - run: npm test
      - run: npm run build

  sdk:
    name: SDK (format, lint, types, tests, build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: packages/sdk
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: 26
          cache: npm
          cache-dependency-path: packages/sdk/package-lock.json
      - run: npm ci
      - run: npm run format:check
      - run: npm run lint
      - name: Generated API types match openapi.json
        run: |
          npm run api:types
          git diff --exit-code -- src/generated/api-schema.d.ts
      - run: npm run typecheck
      - run: npm test
      - run: npm run build

  mcp:
    name: MCP server (format, lint, types, tests, build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: packages/mcp
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: 26
          cache: npm
          cache-dependency-path: packages/mcp/package-lock.json
      - run: npm ci
      - run: npm run format:check
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - run: npm run build

  images:
    name: Docker images build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4
      - uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7
        with:
          context: .
          file: crates/server/Dockerfile
          push: false
          cache-from: type=gha,scope=api
          cache-to: type=gha,mode=max,scope=api
      - uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7
        with:
          context: .
          file: deploy/caddy/Dockerfile
          build-args: VITE_API_URL=https://api.example.com
          push: false
          cache-from: type=gha,scope=caddy
          cache-to: type=gha,mode=max,scope=caddy
      - uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7
        with:
          context: .
          file: deploy/backup/Dockerfile
          push: false
          cache-from: type=gha,scope=backup
          cache-to: type=gha,mode=max,scope=backup
