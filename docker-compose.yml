services:
  postgres:
    image: postgres:19
    # Like production: every project's pools share this server, and the HTTP tests run many
    # projects at once (one per test thread).
    command: ["postgres", "-c", "max_connections=300"]
    environment:
      POSTGRES_USER: nelcota
      POSTGRES_PASSWORD: nelcota
      POSTGRES_DB: nelcota_control
    ports:
      - "127.0.0.1:5434:5432"
    volumes:
      # Postgres 18+ images keep the cluster under a versioned folder (19/docker) of this mount.
      - postgres-data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U nelcota -d nelcota_control"]
      interval: 2s
      timeout: 3s
      retries: 20

  # Local SMTP server that captures every email; web UI and API on http://localhost:8026.
  mailpit:
    image: axllent/mailpit:v1.34.0
    environment:
      # Accept any (or no) SMTP credentials over plain connections, like a tenant's own server.
      MP_SMTP_AUTH_ACCEPT_ANY: "1"
      MP_SMTP_AUTH_ALLOW_INSECURE: "1"
    ports:
      - "127.0.0.1:1026:1025"
      - "127.0.0.1:8026:8025"

volumes:
  postgres-data:
    # One volume per major version: a new major cannot read the previous one's files, so data
    # moves with pg_dumpall and the old volume stays as a fallback.
    name: nelcotacloud_postgres-data-v19
