<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="color-scheme" content="light only" />
    <title>{{ content.subject }}</title>
  </head>
  <body style="margin:0;padding:0;background:#f4f4f5;font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif;color:#18181b;">
    <table role="presentation" width="100%" cellspacing="0" cellpadding="0" style="background:#f4f4f5;padding:32px 16px;">
      <tr>
        <td align="center">
          <table role="presentation" width="100%" cellspacing="0" cellpadding="0" style="max-width:480px;background:#ffffff;border-radius:12px;border:1px solid #e4e4e7;">
            <tr>
              <td style="padding:32px;">
                <p style="margin:0 0 24px;font-size:14px;font-weight:600;color:#52525b;">{{ content.tenant_name }}</p>
                <h1 style="margin:0 0 12px;font-size:20px;line-height:28px;font-weight:600;">{{ content.heading }}</h1>
                <p style="margin:0 0 24px;font-size:15px;line-height:24px;color:#3f3f46;">{{ content.message }}</p>
                <table role="presentation" cellspacing="0" cellpadding="0">
                  <tr>
                    <td style="border-radius:8px;background:#18181b;">
                      <a href="{{ content.link }}" style="display:inline-block;padding:12px 20px;font-size:15px;font-weight:600;color:#ffffff;text-decoration:none;">{{ content.action_label }}</a>
                    </td>
                  </tr>
                </table>
                <p style="margin:24px 0 0;font-size:13px;line-height:20px;color:#71717a;">{{ content.expiry_note }}</p>
                <p style="margin:8px 0 0;font-size:13px;line-height:20px;color:#71717a;">{{ content.ignore_note }}</p>
                <p style="margin:24px 0 0;font-size:12px;line-height:18px;color:#a1a1aa;word-break:break-all;">{{ content.link }}</p>
              </td>
            </tr>
          </table>
        </td>
      </tr>
    </table>
  </body>
</html>
