[package]
name = "server"
version = "0.1.0"
edition = "2024"
default-run = "server"

[[bin]]
name = "export-openapi"
path = "src/bin/export_openapi.rs"

[dependencies]
aes-gcm = "0.11.1"
argon2 = "0.6.0"
askama = { version = "0.16.1", default-features = false, features = ["derive", "std", "urlencode"] }
aws-sdk-s3 = { version = "1.161.0", default-features = false, features = ["default-https-client", "rt-tokio"] }
axum = "0.8.9"
base16ct = { version = "1.0.0", features = ["alloc"] }
base64 = "0.23.1"
csv = "1.4.0"
dotenvy = "0.15.7"
ed25519-dalek = { version = "3.0.0", features = ["pkcs8", "alloc"] }
envy = "0.4.2"
futures-util = { version = "0.3.34", default-features = false, features = ["std"] }
governor = "0.10.4"
hmac = "0.13.0"
image = { version = "0.25.10", default-features = false, features = ["jpeg", "png", "webp"] }
jsonwebtoken = { version = "12.0.0", default-features = false, features = ["rust_crypto"] }
lettre = { version = "0.11.24", default-features = false, features = ["builder", "smtp-transport", "tokio1", "tokio1-rustls", "ring", "webpki-roots"] }
moka = { version = "0.12.16", features = ["future"] }
oauth-providers = { version = "0.1.0", default-features = false }
percent-encoding = "2.3.2"
pg_query = "18.1.0"
rand = "0.10.4"
redis = { version = "1.8.2", default-features = false, features = ["tokio-comp", "connection-manager"] }
reqwest = { version = "0.13.5", default-features = false, features = ["json", "query", "rustls"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
sha2 = "0.11.1"
sqlx = { version = "0.9.1", default-features = false, features = ["runtime-tokio", "tls-rustls", "postgres", "uuid", "time", "json", "migrate", "macros"] }
thiserror = "2.0.21"
time = { version = "0.3.55", features = ["serde", "serde-well-known"] }
tokio = { version = "1.54.1", features = ["macros", "rt-multi-thread", "net", "signal", "sync"] }
totp-rs = { version = "6.0.0", features = ["otpauth"] }
tower-http = { version = "0.7.1", features = ["trace", "cors", "set-header", "request-id", "timeout"] }
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter"] }
url = "2.5.8"
utoipa = { version = "6.0.0", features = ["axum_extras", "uuid", "time"] }
utoipa-axum = "0.3.0"
uuid = { version = "1.29.3", features = ["v4", "serde"] }
validator = { version = "0.21.0", features = ["derive"] }

[dev-dependencies]
tokio = { version = "1.54.1", features = ["test-util"] }
wiremock = "0.6.5"

[lints]
workspace = true
